<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Servicio suspendido</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f5f6f8;
      font-family: Arial, Helvetica, sans-serif;
      color: #222;
    }

    .card {
      width: 100%;
      max-width: 620px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 45px 40px;
      text-align: center;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
    }

    .icon {
      width: 58px;
      height: 58px;
      margin: 0 auto 22px;
      border-radius: 50%;
      background: #f1f1f1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 27px;
      font-weight: 600;
    }

    p {
      margin: 0 auto 14px;
      max-width: 500px;
      font-size: 16px;
      line-height: 1.6;
      color: #555;
    }

    .highlight {
      margin-top: 25px;
      padding: 18px;
      background: #f8f8f8;
      border-radius: 7px;
      color: #333;
      font-size: 15px;
      line-height: 1.5;
    }

    .footer {
      margin-top: 30px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="icon">!</div>

    <h1>Servicio suspendido</h1>

    <p>
      El acceso al Sistema se encuentra temporalmente suspendido
      debido a que la renovación del servicio se encuentra pendiente.
    </p>

    <div class="highlight">
      Para reactivar el servicio, favor contactar a
      <strong>Intrepidux S.R.L.</strong> y coordinar la renovación.
    </div>

    <div class="footer">
      Intrepidux S.R.L.<br>
      Soluciones ERP
    </div>

  </main>

</body>
</html>
